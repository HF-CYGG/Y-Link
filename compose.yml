#
# 文件说明：本地/服务器默认分体部署编排文件。
# 实现逻辑：
# 1. `backend` 使用 SQLite 落盘，适合快速部署与小规模一体化场景；
# 2. `frontend` 负责托管静态资源，并通过 Nginx 反向代理后端 API 与上传文件；
# 3. 通过 volume 持久化 SQLite 数据与商品图片，并通过健康检查串联前后端启动顺序。
#
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      Y_LINK_TRUST_PROXY: ${Y_LINK_FRONTEND_PROXY_IP:-172.30.91.2}
      Y_LINK_FORCE_SECURE_COOKIES: ${Y_LINK_FORCE_SECURE_COOKIES:-false}
      PORT: 3001
      TZ: ${TZ:-Asia/Shanghai}
      DB_TYPE: sqlite
      SQLITE_DB_PATH: /app/data/y-link.sqlite
      DB_SYNC: "false"
      INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME:-admin}
      INIT_ADMIN_DISPLAY_NAME: ${INIT_ADMIN_DISPLAY_NAME:-系统管理员}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:?请在启动前配置 INIT_ADMIN_PASSWORD 私有强密码}
      INVITE_CODE_PEPPER: ${INVITE_CODE_PEPPER:-}
      VERIFICATION_CODE_REQUEST_TIMEOUT_MS: ${VERIFICATION_CODE_REQUEST_TIMEOUT_MS:-8000}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      VERIFICATION_TICKET_HMAC_SECRET: ${VERIFICATION_TICKET_HMAC_SECRET:-}
      ALIYUN_DYPNS_MNS_ENABLED: ${ALIYUN_DYPNS_MNS_ENABLED:-false}
    volumes:
      - y_link_sqlite_data:/app/data
      # 上传图片默认落在 `/app/uploads`，这里显式持久化，避免容器重建后商品图丢失。
      - y_link_uploads_data:/app/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      proxy_boundary: {}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      Y_LINK_TRUSTED_EDGE_PROXIES: ${Y_LINK_TRUSTED_EDGE_PROXIES:-}
      Y_LINK_HSTS_MAX_AGE_SECONDS: ${Y_LINK_HSTS_MAX_AGE_SECONDS:-15552000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test:
        - CMD-SHELL
        # 既校验前端静态页可访问，也校验 Nginx 到后端的 /health 代理链路可用。
        - wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      proxy_boundary:
        ipv4_address: ${Y_LINK_FRONTEND_PROXY_IP:-172.30.91.2}
    restart: unless-stopped

volumes:
  y_link_sqlite_data:
  y_link_uploads_data:

# 独立网络与前端固定地址共同限定 Node 的可信代理，不信任整个 RFC1918。
networks:
  proxy_boundary:
    ipam:
      config:
        - subnet: ${Y_LINK_PROXY_NETWORK_CIDR:-172.30.91.0/24}
