name: 数据库自动迁移端到端验收

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/database-migration-e2e.yml"
      - "backend/src/**"
      - "backend/package*.json"
      - "docker/compose.verify-db-migration.yml"
      - "docker/onebox/**"
      - "Dockerfile.onebox"
      - "scripts/verify-db-migration-timeout.test.mjs"
      - "scripts/verify-db-migration.mjs"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/database-migration-e2e.yml"
      - "backend/src/**"
      - "backend/package*.json"
      - "docker/compose.verify-db-migration.yml"
      - "docker/onebox/**"
      - "Dockerfile.onebox"
      - "scripts/verify-db-migration-timeout.test.mjs"
      - "scripts/verify-db-migration.mjs"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: database-migration-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 严格验收（分片 ${{ matrix.shard }}/6）
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # 单个 PR 最多占用两个托管 Runner，避免数据库矩阵挤压其他工作流。
      max-parallel: 2
      matrix:
        include:
          - shard: 1
            scenarios: success wrong-connection old-version
          - shard: 2
            scenarios: wrong-charset insufficient-permissions non-empty-target
          - shard: 3
            scenarios: duplicate-task content-tamper execution-interruption
          - shard: 4
            scenarios: cutover-persistence-failure switching-emergency-rollback cutover-cancel-persistence-failure
          - shard: 5
            scenarios: rollback-finalizer-persistence-failure task-creation-persistence-failure corrupted-active-task
          - shard: 6
            scenarios: corrupted-cutover-marker verifying-emergency-rollback failure-rollback
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 固定 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 检查 Docker Compose
        run: docker compose version

      - name: 验证 Docker 前置门禁超时
        run: npm run verify:db:migration:timeout

      - name: 运行分片内 SQLite 到 MySQL 严格验收
        shell: bash
        env:
          Y_LINK_DB_MIGRATION_SCENARIOS: ${{ matrix.scenarios }}
          Y_LINK_DB_MIGRATION_TIMEOUT_MS: "300000"
        run: |
          set -uo pipefail

          failures=()
          for scenario in $Y_LINK_DB_MIGRATION_SCENARIOS; do
            echo "::group::数据库迁移场景：${scenario}"
            if Y_LINK_DB_MIGRATION_SCENARIO="$scenario" npm run verify:db:migration; then
              printf -- '- ✅ `%s`\n' "$scenario" >> "$GITHUB_STEP_SUMMARY"
            else
              exit_code=$?
              failures+=("${scenario}:${exit_code}")
              printf -- '- ❌ `%s`（退出码 %s）\n' "$scenario" "$exit_code" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done

          if (( ${#failures[@]} > 0 )); then
            printf '失败场景：%s\n' "${failures[*]}" >&2
            exit 1
          fi
