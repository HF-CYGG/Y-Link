name: Mobile 基础检查

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - "scripts/verify-mobile-workspace.mjs"
      - ".github/workflows/mobile-check.yml"
  push:
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - "scripts/verify-mobile-workspace.mjs"
      - ".github/workflows/mobile-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile 工程
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js 22.13.1
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装统一 workspace 依赖
        run: npm ci

      - name: 检查 Mobile workspace 依赖模型
        run: npm run verify:mobile:workspace

      - name: 检查 Expo 依赖一致性
        run: npm --workspace y-link-mobile run dependencies:check

      - name: 验证 SQLite 迁移框架
        run: npm --workspace y-link-mobile run test:db

      - name: 检查 Mobile TypeScript
        run: npm --workspace y-link-mobile run typecheck

      - name: 导出 Android bundle
        run: npm --workspace y-link-mobile run export:android

  foundations:
    name: 共享基础
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js 22.13.1
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装根依赖
        run: npm ci

      - name: 检查共享包 TypeScript
        run: node ./node_modules/typescript/bin/tsc -p packages/tsconfig.json --noEmit

      - name: 运行 Native API client 测试
        run: node --experimental-strip-types --test packages/api-client/test/*.test.ts
