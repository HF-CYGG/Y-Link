name: Mobile 基础检查

on:
  # 待 Mobile 工程准备就绪后，恢复 PR/push 自动触发。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 安装 Node.js 22.23.5
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.5"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装统一 workspace 依赖
        run: npm ci

      - name: 检查 Mobile workspace 依赖模型
        run: npm run verify:mobile:workspace

      # 应用源码完整恢复后再恢复 Expo 依赖、SQLite、类型检查与 Android 导出步骤。

  foundations:
    name: 共享基础
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 安装 Node.js 22.23.5
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.5"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装根依赖
        run: npm ci

      - name: 检查共享包 TypeScript
        run: node ./node_modules/typescript/bin/tsc -p packages/tsconfig.json --noEmit

      - name: 运行 Native API client 测试
        run: node --experimental-strip-types --test packages/api-client/test/*.test.ts
