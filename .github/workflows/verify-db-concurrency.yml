# 模块说明：GitHub Pull Request 必要检查
# 文件职责：只运行 Web/后端构建和秒级关键契约，尽快确认提交具备合入基础。
# 维护说明：Ruleset 要求的状态名是 `verify`，不得改名；Docker、数据库迁移与并发改在本地按改动范围执行；依赖漏洞与 Node 安全补丁由 security-updates.yml 独立检查。
# 提速说明：后端 lockfile 锁定 prebuild-install@7.1.3（依赖 napi-build-utils@2）。旧版 napi-build-utils@1 按字符串比较 N-API 版本，
#           Node 22.14+ 的 N-API 升到 10 后 sqlite3 拿不到预编译包，会回退 node-gyp 源码编译，冷安装约 85 秒；修正后约 6 秒。
#           不要把 prebuild-install 降回 7.1.2 及以下。backend/node_modules 仍按「系统 + 架构 + 实际 Node 版本 + 后端 lockfile」缓存，
#           命中时跳过安装；根 Web 依赖冷安装仅约 9 秒且体积大，继续走 npm 下载缓存，避免解包耗时反超安装。

name: PR 必要检查

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-db-concurrency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 安装 Node.js
        id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.5"
          cache: npm
          registry-url: https://registry.npmjs.org
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # sqlite3 等原生模块与 Node ABI 绑定，缓存键必须包含 setup-node 实际解析出的完整版本号。
      # main 分支 push 也会运行本工作流并写入缓存，PR 分支可直接复用 main 的缓存。
      - name: 固定派生 npm 11.21.2-ylink.1（官方源/本地修订校验）
        run: node backend/scripts/install-pinned-npm.mjs --context=ci

      - name: 恢复后端依赖目录缓存
        id: backend-deps-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/node_modules
          key: backend-node-modules-controlled-sqlite3541-npm11.21.2-ylink.1-${{ runner.os }}-${{ runner.arch }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('backend/package-lock.json', 'backend/package.json', 'backend/src/database/pinned-sqlite-source.json', 'backend/scripts/*pinned-sqlite*.mjs', 'backend/npm-toolchain/*.json', 'backend/scripts/*pinned-npm*.mjs') }}

      - name: 安装根 Web 依赖
        run: npm ci --workspaces=false --no-audit --no-fund

      - name: 安装后端依赖
        if: steps.backend-deps-cache.outputs.cache-hit != 'true'
        run: npm --prefix ./backend ci --no-audit --no-fund

      - name: 校验实际 SQLite 绑定（缓存命中也执行）
        run: node backend/scripts/verify-pinned-sqlite.mjs --project=backend --static

      - name: 检查文本编码
        run: npm run verify:text-encoding

      - name: 验证工作流权限、依赖闭包与后端身份契约
        run: node --test scripts/verify-action-workflow-pins.test.mjs scripts/verify-node-workflow-pins.test.mjs scripts/verify-dependency-audit-scope.test.mjs scripts/verify-onebox-identity.test.mjs scripts/verify-pinned-npm.test.mjs backend/scripts/pinned-npm-source.test.mjs backend/scripts/audit-pinned-npm.test.mjs

      - name: 构建 Web
        run: npm run build

      - name: 构建后端
        run: npm --prefix ./backend run build

      - name: 验证出站 HTTP DNS 与重定向安全边界
        run: npm --prefix ./backend run security:safe-http:verify

      - name: 执行 MySQL 启动结构契约验收
        run: npm --prefix ./backend run verify:mysql:schema-contract

      - name: 执行 YZ 通用 SKU 编码体系验收
        run: npm --prefix ./backend run product:yz-code:verify

      - name: 执行 YZ 建库 Excel 导入验收
        run: npm --prefix ./backend run product:import-yz:verify

      - name: 执行路由权限契约检查
        run: npm --prefix ./backend run task2:route-contract:verify

      - name: 执行写事务闸门契约检查
        run: npm --prefix ./backend run write-transaction:contract:verify
