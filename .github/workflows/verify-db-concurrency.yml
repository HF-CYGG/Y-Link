# 模块说明：GitHub Actions 数据库并发验收流水线
# 文件职责：在 CI 中复用项目统一入口 `npm run verify:db:concurrency`，自动准备受控 MySQL 临时环境并执行并发校验
# 维护说明：若后续调整 Node 版本、依赖安装方式或并发验收入口，请同步更新本文件

#
# 文件说明：GitHub Actions 数据库并发验收工作流。
# 实现逻辑：
# 1. 在手动触发、主分支推送或拉取请求时执行；
# 2. 安装根目录与后端依赖前，显式把 npm registry 固定为官方源；
# 3. 安装完成后分别执行根 Web（显式排除 workspaces）与后端 `npm audit`，确保 CI 使用官方审计口径；
# 4. 先做写事务闸门静态契约检查——纯静态、无任何运行时依赖，最快暴露绕过闸门的新代码；
# 5. 再跑 MySQL 启动结构契约，确保漏执行 035/036 时会在对外服务前阻断；
# 6. 接着跑 `transaction-coordinator:verify`，覆盖 QueryRunner 长事务租约、异常 release 与原始事务 SQL 门禁；
# 7. 再跑 `task8:verify` 守住 SQLite 业务并发写事务（两者只依赖本地 SQLite，失败即止，
#    不必先花时间拉起 Docker MySQL）；
# 8. 运行 Mobile Auth SQLite 专项 Gate，再复用统一命令覆盖订单并发与 Mobile Auth MySQL G-1～G-7；
# 9. MySQL 临时环境由脚本内部自动通过 Docker Compose 准备与清理，避免 CI 额外维护服务编排。
#
name: verify-db-concurrency

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-db-concurrency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: 安装根 Web 依赖
        run: npm ci --workspaces=false

      - name: 安装后端依赖
        run: npm --prefix ./backend ci

      - name: 执行 Web 依赖安全审计
        run: npm audit --package-lock-only --workspaces=false --audit-level=high

      - name: 执行后端依赖安全审计
        run: npm --prefix ./backend audit --audit-level=high

      # 写事务闸门的静态契约门禁：纯静态解析、秒级完成、无任何运行时依赖，
      # 因此排在所有运行时验收之前——绕过闸门的新代码在这里就会被拦下。
      - name: 执行写事务闸门契约检查
        run: npm --prefix ./backend run write-transaction:contract:verify

      - name: 执行 MySQL 启动结构契约验收
        run: npm --prefix ./backend run verify:mysql:schema-contract

      - name: 执行 SQLite 事务协调器入口覆盖回归
        run: npm --prefix ./backend run transaction-coordinator:verify

      # SQLite 侧的并发写事务回归：并发提交 16 笔出库单，若哪天写事务绕过
      # `runInTransaction` 闸门、直接调用 `AppDataSource.transaction`，这一步会立刻报
      # `cannot start a transaction within a transaction` 或 `no such savepoint`。
      # 该守卫此前不在任何流水线里，正因如此 issue #36 才长期未被发现。
      - name: 执行 SQLite 并发写事务回归
        run: npm --prefix ./backend run task8:verify

      - name: 执行 Mobile Auth SQLite G-1～G-7 专项验收
        run: npm --prefix ./backend run mobile-auth:contract:verify

      - name: 执行订单并发与 Mobile Auth MySQL G-1～G-7 专项验收
        run: npm run verify:db:concurrency
