# 模块说明：GitHub Pull Request 必要检查
# 文件职责：只运行 Web/后端构建和秒级关键契约，尽快确认提交具备合入基础。
# 维护说明：Ruleset 要求的状态名是 `verify`，不得改名；Docker、数据库迁移、并发与依赖审计改在本地按改动范围执行。

name: PR 必要检查

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-db-concurrency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: 安装根 Web 依赖
        run: npm ci --workspaces=false

      - name: 安装后端依赖
        run: npm --prefix ./backend ci

      - name: 检查文本编码
        run: npm run verify:text-encoding

      - name: 构建 Web
        run: npm run build

      - name: 构建后端
        run: npm --prefix ./backend run build

      - name: 执行 MySQL 启动结构契约验收
        run: npm --prefix ./backend run verify:mysql:schema-contract

      - name: 执行路由权限契约检查
        run: npm --prefix ./backend run task2:route-contract:verify

      - name: 执行写事务闸门契约检查
        run: npm --prefix ./backend run write-transaction:contract:verify
