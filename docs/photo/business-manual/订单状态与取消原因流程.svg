<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><style>text{font-family:"Microsoft YaHei",sans-serif;fill:#12314A}.t{font-size:28px;font-weight:700}.s{font-size:13px;fill:#5F7380}.h{font-size:18px;font-weight:700}.d{font-size:12px;fill:#466276}.b{fill:#EEFDF8;stroke:#81C9BC}.r{fill:#FFF2F2;stroke:#E5A3A3}.o{fill:#FFF8E8;stroke:#D8BD82}.a{stroke:#149B8A;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#149B8A"/></marker></defs><rect width="1200" height="520" fill="#F6FBFC" stroke="#D8E8EC"/><text x="600" y="48" text-anchor="middle" class="t">订单状态与取消原因</text><text x="600" y="76" text-anchor="middle" class="s">流程示意，非系统截图；以订单详情状态报告为准</text><rect x="65" y="230" width="230" height="110" rx="14" class="b"/><text x="180" y="276" text-anchor="middle" class="h">待核销</text><text x="180" y="302" text-anchor="middle" class="d">可改单或撤回</text><rect x="485" y="310" width="230" height="100" rx="14" class="b"/><text x="600" y="354" text-anchor="middle" class="h">已核销</text><text x="600" y="380" text-anchor="middle" class="d">可申请退货</text><rect x="485" y="120" width="230" height="100" rx="14" class="r"/><text x="600" y="164" text-anchor="middle" class="h">已取消</text><text x="600" y="190" text-anchor="middle" class="d">取货码失效</text><rect x="900" y="250" width="230" height="110" rx="14" class="o"/><text x="1015" y="296" text-anchor="middle" class="h">取消情形</text><text x="1015" y="322" text-anchor="middle" class="d">客户撤回 / 门店取消 / 超时</text><line x1="300" y1="285" x2="480" y2="360" class="a"/><line x1="300" y1="275" x2="480" y2="175" class="a"/><line x1="720" y1="170" x2="895" y2="300" class="a"/><text x="600" y="80" text-anchor="middle" class="s">门店人工取消时，查看商家取消原因或留言；不要仅用时间推断原因。</text></svg>
