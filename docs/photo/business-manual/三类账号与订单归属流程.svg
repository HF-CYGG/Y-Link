<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <style>text{font-family:"Microsoft YaHei",sans-serif;fill:#12314A}.t{font-size:28px;font-weight:700}.s{font-size:13px;fill:#5F7380}.h{font-size:18px;font-weight:700}.d{font-size:12px;fill:#466276}.b{fill:#EEFDF8;stroke:#81C9BC;stroke-width:1}.o{fill:#FFF8E8;stroke:#81C9BC;stroke-width:1}.a{stroke:#149B8A;stroke-width:3;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#149B8A"/></marker></defs>
  <rect width="1200" height="520" fill="#F6FBFC" stroke="#D8E8EC"/><text x="600" y="48" text-anchor="middle" class="t">三类账号与订单归属</text><text x="600" y="76" text-anchor="middle" class="s">流程示意，非系统截图；仅使用虚构信息</text>
  <g><rect x="70" y="270" width="290" height="105" rx="14" class="b"/><text x="215" y="316" text-anchor="middle" class="h">个人账号</text><text x="215" y="342" text-anchor="middle" class="d">客户端个人注册</text><line x1="215" y1="265" x2="215" y2="170" class="a"/><rect x="90" y="52" width="250" height="105" rx="14" class="b"/><text x="215" y="98" text-anchor="middle" class="h">散客订</text><text x="215" y="124" text-anchor="middle" class="d">不可手动切换</text></g>
  <g><rect x="455" y="270" width="290" height="105" rx="14" class="b"/><text x="600" y="316" text-anchor="middle" class="h">教师邀请码注册</text><text x="600" y="342" text-anchor="middle" class="d">工号 + 8 位邀请码</text><line x1="600" y1="265" x2="600" y2="170" class="a"/><rect x="475" y="52" width="250" height="105" rx="14" class="b"/><text x="600" y="98" text-anchor="middle" class="h">散客订</text><text x="600" y="124" text-anchor="middle" class="d">教师仍为个人账号</text></g>
  <g><rect x="840" y="270" width="290" height="105" rx="14" class="o"/><text x="985" y="316" text-anchor="middle" class="h">部门共享账号</text><text x="985" y="342" text-anchor="middle" class="d">管理员创建并交付</text><line x1="985" y1="265" x2="985" y2="170" class="a"/><rect x="860" y="52" width="250" height="105" rx="14" class="b"/><text x="985" y="98" text-anchor="middle" class="h">部门订</text><text x="985" y="124" text-anchor="middle" class="d">绑定部门节点</text></g>
</svg>
