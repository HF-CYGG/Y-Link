<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><style>text{font-family:"Microsoft YaHei",sans-serif;fill:#12314A}.t{font-size:28px;font-weight:700}.s{font-size:13px;fill:#5F7380}.h{font-size:18px;font-weight:700}.d{font-size:12px;fill:#466276}.b{fill:#EEFDF8;stroke:#81C9BC}.o{fill:#FFF8E8;stroke:#D8BD82}.a{stroke:#149B8A;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#149B8A"/></marker></defs><rect width="1200" height="520" fill="#F6FBFC" stroke="#D8E8EC"/><text x="600" y="48" text-anchor="middle" class="t">管理端部门共享账号开户</text><text x="600" y="76" text-anchor="middle" class="s">流程示意，非系统截图；不显示任何真实凭据</text><g><rect x="45" y="215" width="240" height="115" rx="14" class="b"/><text x="165" y="262" text-anchor="middle" class="h">维护部门树</text><text x="165" y="290" text-anchor="middle" class="d">稳定部门节点</text><line x1="290" y1="272" x2="330" y2="272" class="a"/><rect x="335" y="215" width="240" height="115" rx="14" class="b"/><text x="455" y="262" text-anchor="middle" class="h">选择并预检</text><text x="455" y="290" text-anchor="middle" class="d">跳过已绑定部门</text><line x1="580" y1="272" x2="620" y2="272" class="a"/><rect x="625" y="215" width="240" height="115" rx="14" class="b"/><text x="745" y="262" text-anchor="middle" class="h">批量开户</text><text x="745" y="290" text-anchor="middle" class="d">账号、初始密码、状态</text><line x1="870" y1="272" x2="910" y2="272" class="a"/><rect x="915" y="215" width="240" height="115" rx="14" class="o"/><text x="1035" y="262" text-anchor="middle" class="h">受控交付</text><text x="1035" y="290" text-anchor="middle" class="d">关闭后清理明文凭据</text></g><text x="600" y="115" text-anchor="middle" class="s">部门共享账号只能由管理员创建，客户端不能自助注册。</text><text x="600" y="150" text-anchor="middle" class="s">凭据不写入手册、群公告、截图或非受控文件。</text></svg>
