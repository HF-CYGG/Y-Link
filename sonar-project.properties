# 模块说明：sonar-project.properties
# 文件职责：SonarCloud CI 分析配置，由 .github/workflows/sonarcloud.yml 中的 SonarScanner 读取：项目标识、源码与测试划分、覆盖率报告路径。
# 实现逻辑：
# - SonarCloud 的覆盖率导入只支持 CI 分析，自动分析不支持，因此改为在 GitHub Actions 中扫描，本文件取代原 .sonarcloud.properties；
# - 源码与测试都以仓库根为范围，再用 inclusions / exclusions 精确划分，覆盖散落在 src、apps、packages 中的测试文件；
# - 同一文件不能同时被索引为源码和测试，因此测试模式在 sonar.test.inclusions 与 sonar.exclusions 中各写一份；
# - 覆盖率由 npm run coverage:report 生成，报告中的路径已统一为相对仓库根。
# 维护说明：
# - 新增测试模式时，必须同时追加到下面两个列表，否则分析会因“文件被索引两次”而失败；
# - 会在生产数据上运行的运维脚本（如 audit-mysql-production.mjs、inventory-reconcile-audit.ts）与构建工具（scripts/run-*.mjs）
#   必须保留为源码，不要归入测试，否则其安全问题会被隐藏；
# - CI 中存在根目录与 backend 两份 node_modules，扫描器虽会按 .gitignore 排除，这里仍显式排除，避免依赖目录被误索引；
# - 分诊依据见 docs/版本排期-v1.6.0与v2.0.0.md 第 8 节。

sonar.organization=hf-cygg
sonar.projectKey=HF-CYGG_Y-Link
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=.

# 测试代码：验证脚本、测试夹具与测试辅助、各工作区的单元测试文件。
sonar.test.inclusions=\
  backend/scripts/**/*verify*,\
  backend/scripts/fixtures/**,\
  backend/scripts/support/**,\
  scripts/verify-*,\
  scripts/*visual-fixture*,\
  scripts/voucher-visual-vite.config.ts,\
  packages/*/test/**,\
  **/*.test.*,\
  **/*.spec.*
sonar.test.exclusions=\
  **/node_modules/**

# 不作为源码分析：上面的全部测试模式、文档目录（含误提交的组件副本）与依赖目录。
sonar.exclusions=\
  backend/scripts/**/*verify*,\
  backend/scripts/fixtures/**,\
  backend/scripts/support/**,\
  scripts/verify-*,\
  scripts/*visual-fixture*,\
  scripts/voucher-visual-vite.config.ts,\
  packages/*/test/**,\
  **/*.test.*,\
  **/*.spec.*,\
  docs/**,\
  **/node_modules/**

# 覆盖率：后端验证脚本与共享包单测在 Node 内置覆盖率下运行后合并的 lcov。
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# 覆盖率统计范围：根目录 scripts/ 是本地联调、构建与 CI 工具，只在构建阶段使用、不进入任何运行镜像，
# 不计入覆盖率（仍照常做问题检测）；backend/scripts 中的运维脚本会在生产数据上运行，仍计入覆盖率。
sonar.coverage.exclusions=\
  scripts/**
